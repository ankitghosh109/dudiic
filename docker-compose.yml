services:
  api:
    build:
      context: .
      dockerfile: apps/api/dockerfile

    dns:
    - 1.1.1.1
    - 8.8.8.8

    container_name: dudiic-api
    working_dir: /app

    ports:
      - "6000:6000"

    volumes:
      - .:/app

    env_file:
      - .env.development.local

    depends_on:
      postgres:
        condition: service_healthy

    command: pnpm --dir apps/api dev
    restart: unless-stopped
  postgres:
    image: postgres:18-alpine

    dns:
      - 1.1.1.1
      - 8.8.8.8

    container_name: dudiic-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dudiic
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/dudiic

    ports:
      - "5432:5432"

    volumes:
      - dudiic-postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dudiic"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

volumes:
  dudiic-node-modules:
  dudiic-api-node-modules:
  dudiic-postgres-data:
